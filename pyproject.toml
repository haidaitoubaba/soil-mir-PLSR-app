[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soil-mir-app"
version = "0.1.0"
description = "Local-first UI and scientific engine for soil MIR PLSR workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "streamlit>=1.39",
]

[project.optional-dependencies]
science = [
  "joblib>=1.3",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "brukeropusreader>=1.3.4",
]
test = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
