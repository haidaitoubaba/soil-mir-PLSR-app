stages:
  - validate
  - test

default:
  interruptible: true

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

ci_config_check:
  stage: validate
  image: alpine:3.20
  script:
    - echo "GitLab CI is active for $CI_PROJECT_PATH on $CI_COMMIT_REF_NAME"
    - |
      found=0
      for f in pyproject.toml requirements.txt package.json go.mod "*.sln" "*.csproj" Cargo.toml pom.xml build.gradle build.gradle.kts; do
        if ls $f >/dev/null 2>&1; then
          echo "Detected: $f"
          found=1
        fi
      done
      if [ "$found" -eq 0 ]; then
        echo "No supported application manifest yet; CI bootstrap is healthy."
      fi

python_test:
  stage: test
  image: python:3.12-slim
  rules:
    - exists:
        - pyproject.toml
        - requirements.txt
        - setup.py
        - setup.cfg
  before_script:
    - python -m pip install --upgrade pip
    - |
      if [ -f requirements.txt ]; then
        python -m pip install -r requirements.txt
      elif [ -f pyproject.toml ]; then
        python -m pip install -e ".[test]" || python -m pip install -e . || python -m pip install .
      else
        python -m pip install -e . || true
      fi
  script:
    - |
      if [ -d tests ] || [ -f pytest.ini ] || [ -f conftest.py ]; then
        python -m pip install pytest
        python -m pytest -q
      else
        python -m compileall -q .
      fi

node_test:
  stage: test
  image: node:22
  rules:
    - exists:
        - package.json
  before_script:
    - |
      if [ -f package-lock.json ]; then
        npm ci
      else
        npm install
      fi
  script:
    - npm test --if-present
    - npm run build --if-present

go_test:
  stage: test
  image: golang:1.24
  rules:
    - exists:
        - go.mod
  script:
    - go test ./...

dotnet_test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  rules:
    - exists:
        - "*.sln"
        - "*.csproj"
        - "**/*.csproj"
  script:
    - dotnet restore
    - dotnet test --no-restore --configuration Release

rust_test:
  stage: test
  image: rust:1.90
  rules:
    - exists:
        - Cargo.toml
  script:
    - |
      if [ -f Cargo.lock ]; then
        cargo test --locked
      else
        cargo test
      fi

maven_test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  rules:
    - exists:
        - pom.xml
  script:
    - mvn -B test

gradle_test:
  stage: test
  image: gradle:8.10-jdk21
  rules:
    - exists:
        - build.gradle
        - build.gradle.kts
  script:
    - |
      if [ -x ./gradlew ]; then
        ./gradlew test
      else
        gradle test
      fi
