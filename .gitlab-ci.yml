include:
  - project: "haidaitoubaba-group/ci-templates"
    ref: "main"
    file: "/python-app.yml"

variables:
  CI_PYTHON_VERSION: "3.11"
  CI_INSTALL_CMD: 'python -m pip install -e ".[test,science]"'
  CI_LINT_PATHS: "src app tests scripts"
  CI_STREAMLIT_APP: "app/Home.py"
  CI_EXTRA_VALIDATE_CMD: >-
    python -c 'import tomllib; config=tomllib.load(open("pyproject.toml","rb")); assert config["project"]["name"] == "soil-mir-app"; print("Project configuration is valid.")' &&
    python scripts/build_mac_release.py --check-only &&
    python scripts/build_windows_release.py --check-only &&
    bash -n run_app.command
  CI_MAC_BUILD_CMD: >-
    python scripts/build_mac_release.py --label "$CI_COMMIT_TAG" --commit "$CI_COMMIT_SHA"
  CI_MAC_VERIFY_CMD: >-
    ls -lh dist/ &&
    rm -rf /tmp/soil-mir-rc-test &&
    mkdir -p /tmp/soil-mir-rc-test &&
    tar -xzf "dist/soil-mir-app-$CI_COMMIT_TAG-mac.tar.gz" -C /tmp/soil-mir-rc-test &&
    test -x "/tmp/soil-mir-rc-test/soil-mir-app-$CI_COMMIT_TAG/run_app.command" &&
    echo "macOS release archive verified"
  CI_WINDOWS_BUILD_CMD: >-
    python scripts/build_windows_release.py --label "$CI_COMMIT_TAG" --commit "$CI_COMMIT_SHA"
  CI_WINDOWS_VERIFY_CMD: >-
    ls -lh dist/ &&
    python -m zipfile -t dist/*-windows.zip


# Keep the shared template unchanged; only this project has release credentials.
stages:
  - validate
  - quality
  - package
  - release

.release_automation:
  stage: release
  image: "python:$CI_PYTHON_VERSION-slim"
  interruptible: false
  cache: []
  resource_group: soil-mir-release

create_release_candidate:
  extends: .release_automation
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  manual_confirmation: "Create a release candidate from this tested main commit?"
  dependencies: []
  environment:
    name: release/tag
  script:
    - python scripts/release_automation.py candidate

promote_release_candidate:
  extends: .release_automation
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-rc[1-9][0-9]*$/ && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  manual_confirmation: "Confirm desktop and scientific acceptance, then publish the official release?"
  dependencies: []
  environment:
    name: release/tag
  script:
    - python scripts/release_automation.py promote

publish_official_release:
  extends: .release_automation
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_REF_PROTECTED == "true"'
  needs:
    - job: mac_rc_bundle
      artifacts: true
    - job: windows_rc_bundle
      artifacts: true
  environment:
    name: release/publish
  script:
    - python scripts/release_automation.py publish
