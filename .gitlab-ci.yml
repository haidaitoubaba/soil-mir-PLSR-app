include:
  - project: "haidaitoubaba-group/ci-templates"
    ref: "main"
    file: "/python-app.yml"

variables:
  CI_PYTHON_VERSION: "3.11"
  CI_INSTALL_CMD: 'python -m pip install -e ".[test,science]"'
  CI_LINT_PATHS: "src app tests scripts"
  CI_STREAMLIT_APP: "app/Home.py"
  CI_EXTRA_VALIDATE_CMD: >-
    python -c 'import tomllib; config=tomllib.load(open("pyproject.toml","rb")); assert config["project"]["name"] == "soil-mir-app"; print("Project configuration is valid.")' &&
    python scripts/build_mac_release.py --check-only &&
    python scripts/build_windows_release.py --check-only &&
    bash -n run_app.command
  CI_MAC_BUILD_CMD: >-
    python scripts/build_mac_release.py --label "$CI_COMMIT_TAG" --commit "$CI_COMMIT_SHA"
  CI_MAC_VERIFY_CMD: >-
    ls -lh dist/ &&
    rm -rf /tmp/soil-mir-rc-test &&
    mkdir -p /tmp/soil-mir-rc-test &&
    tar -xzf "dist/soil-mir-app-$CI_COMMIT_TAG-mac.tar.gz" -C /tmp/soil-mir-rc-test &&
    test -x "/tmp/soil-mir-rc-test/soil-mir-app-$CI_COMMIT_TAG/run_app.command" &&
    echo "macOS release archive verified"
  CI_WINDOWS_BUILD_CMD: >-
    python scripts/build_windows_release.py --label "$CI_COMMIT_TAG" --commit "$CI_COMMIT_SHA"
  CI_WINDOWS_VERIFY_CMD: >-
    ls -lh dist/ &&
    python -m zipfile -t dist/*-windows.zip

# Temporary one-off recovery packages for the immutable v0.2.3 tag.
# The v0.2.3 checkout and main differ only in .gitlab-ci.yml,
# which is intentionally excluded from all distribution archives.
# Do not merge these jobs into main; normal releases remain tag-only.
v023_recovery_mac:
  stage: package
  image: "python:3.11-slim"
  rules:
    - if: '$CI_COMMIT_BRANCH == "release/v0.2.3-recovery"'
      when: on_success
  script:
    - python scripts/build_mac_release.py --label v0.2.3 --commit be6890db9a7266cb8a615553d56b78b3892936c4
    - mkdir -p /tmp/soil-mir-v023-mac
    - tar -xzf dist/soil-mir-app-v0.2.3-mac.tar.gz -C /tmp/soil-mir-v023-mac
    - test -x /tmp/soil-mir-v023-mac/soil-mir-app-v0.2.3/run_app.command
    - grep -qx "commit=be6890db9a7266cb8a615553d56b78b3892936c4" /tmp/soil-mir-v023-mac/soil-mir-app-v0.2.3/BUILD_INFO.txt
    - sha256sum dist/soil-mir-app-v0.2.3-mac.tar.gz
  artifacts:
    paths:
      - dist/soil-mir-app-v0.2.3-mac.tar.gz
    expire_in: 90 days

v023_recovery_windows:
  stage: package
  image: "python:3.11-slim"
  rules:
    - if: '$CI_COMMIT_BRANCH == "release/v0.2.3-recovery"'
      when: on_success
  script:
    - python scripts/build_windows_release.py --label v0.2.3 --commit be6890db9a7266cb8a615553d56b78b3892936c4
    - python -m zipfile -t dist/soil-mir-app-v0.2.3-windows.zip
    - sha256sum dist/soil-mir-app-v0.2.3-windows.zip
  artifacts:
    paths:
      - dist/soil-mir-app-v0.2.3-windows.zip
    expire_in: 90 days
