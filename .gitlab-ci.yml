stages:
  - validate
  - quality
  - package

default:
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

cache:
  key: "python311-pip"
  paths:
    - .cache/pip/

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

.python_test_job:
  image: python:3.11-slim
  before_script:
    - python -m pip install -e ".[test,science]"

ci_config_check:
  stage: validate
  image: python:3.11-slim
  script:
    - python -m compileall -q src app tests scripts
    - python -c 'import tomllib; config=tomllib.load(open("pyproject.toml","rb")); assert config["project"]["name"] == "soil-mir-app"; print("Project configuration is valid.")'
    - python scripts/build_mac_release.py --check-only
    - bash -n run_app.command

lint:
  stage: quality
  image: python:3.11-slim
  before_script:
    - python -m pip install "ruff>=0.6"
  script:
    - ruff check src app tests scripts

pytest:
  extends: .python_test_job
  stage: quality
  script:
    - pytest -q

streamlit_smoke:
  stage: quality
  image: python:3.11-slim
  before_script:
    - python -m pip install "streamlit>=1.39"
  script:
    - streamlit run app/Home.py --server.headless=true --server.port=8501 > /tmp/streamlit.log 2>&1 & echo $! > /tmp/streamlit.pid
    - |
      python - <<'PY'
      import time
      import urllib.request

      deadline = time.time() + 30
      last = None
      while time.time() < deadline:
          try:
              with urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health", timeout=2) as response:
                  body = response.read().decode("utf-8", "replace")
                  if response.status == 200 and "ok" in body.lower():
                      print("Streamlit health check passed")
                      raise SystemExit(0)
          except Exception as exc:
              last = exc
              time.sleep(1)
      raise SystemExit(f"Streamlit did not become healthy: {last}")
      PY
  after_script:
    - if [ -f /tmp/streamlit.pid ]; then kill $(cat /tmp/streamlit.pid) || true; fi
    - cat /tmp/streamlit.log || true

mac_rc_bundle:
  stage: package
  image: python:3.11-slim
  script:
    - release_label="${CI_COMMIT_TAG:-rc-${CI_COMMIT_SHORT_SHA}}"
    - python scripts/build_mac_release.py --label "$release_label" --commit "$CI_COMMIT_SHA"
    - ls -lh dist/
  artifacts:
    name: "soil-mir-mac-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - dist/*.tar.gz
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
