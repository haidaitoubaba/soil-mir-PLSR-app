include:
  - project: "haidaitoubaba-group/ci-templates"
    ref: "main"
    file: "/python-app.yml"

variables:
  CI_PYTHON_VERSION: "3.11"
  CI_INSTALL_CMD: 'python -m pip install -e ".[test,science]"'
  CI_LINT_PATHS: "src app tests scripts"
  CI_STREAMLIT_APP: "app/Home.py"
  CI_EXTRA_VALIDATE_CMD: >-
    python -c 'import tomllib; config=tomllib.load(open("pyproject.toml","rb")); assert config["project"]["name"] == "soil-mir-app"; print("Project configuration is valid.")' &&
    python scripts/build_mac_release.py --check-only &&
    python scripts/build_windows_release.py --check-only &&
    bash -n run_app.command
  CI_MAC_BUILD_CMD: >-
    python scripts/build_mac_release.py --label "$CI_COMMIT_TAG" --commit "$CI_COMMIT_SHA"
  CI_MAC_VERIFY_CMD: >-
    ls -lh dist/ &&
    rm -rf /tmp/soil-mir-rc-test &&
    mkdir -p /tmp/soil-mir-rc-test &&
    tar -xzf "dist/soil-mir-app-$CI_COMMIT_TAG-mac.tar.gz" -C /tmp/soil-mir-rc-test &&
    test -x "/tmp/soil-mir-rc-test/soil-mir-app-$CI_COMMIT_TAG/run_app.command" &&
    echo "macOS release archive verified"
  CI_WINDOWS_BUILD_CMD: >-
    python scripts/build_windows_release.py --label "$CI_COMMIT_TAG" --commit "$CI_COMMIT_SHA"
  CI_WINDOWS_VERIFY_CMD: >-
    ls -lh dist/ &&
    python -m zipfile -t dist/*-windows.zip

# One-time publication of v0.2.3 to GitLab Releases.
# Published distribution archives are the already-verified recovery artifacts,
# and the existing annotated release tag is not changed.
v023_publish_gitlab_release:
  stage: package
  image: "registry.gitlab.com/gitlab-org/cli:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "release/v0.2.3-publish-gitlab"'
      when: on_success
  script:
    - test -f RELEASE_NOTES_v0.2.3.md
    - echo "Publishing the existing v0.2.3 tag as a GitLab release"
  release:
    tag_name: "v0.2.3"
    name: "Soil MIR PLSR v0.2.3"
    description: "./RELEASE_NOTES_v0.2.3.md"
    assets:
      links:
        - name: "Soil MIR v0.2.3 for macOS"
          url: "https://gitlab.com/haidaitoubaba-group/soil-mir-plsr-app/-/jobs/17953891317/artifacts/raw/dist/soil-mir-app-v0.2.3-mac.tar.gz"
          link_type: package
        - name: "Soil MIR v0.2.3 for Windows"
          url: "https://gitlab.com/haidaitoubaba-group/soil-mir-plsr-app/-/jobs/17953891318/artifacts/raw/dist/soil-mir-app-v0.2.3-windows.zip"
          link_type: package
