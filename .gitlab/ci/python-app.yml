stages:
  - validate
  - quality
  - package

default:
  interruptible: true

variables:
  CI_PYTHON_VERSION: "3.11"
  CI_INSTALL_CMD: 'python -m pip install -e ".[test]"'
  CI_LINT_PATHS: "."
  CI_TEST_CMD: "pytest -q"
  CI_STREAMLIT_APP: ""
  CI_EXTRA_VALIDATE_CMD: ""
  CI_MAC_BUILD_CMD: ""
  CI_MAC_VERIFY_CMD: ""
  CI_MAC_ARTIFACT_PATH: "dist/*.tar.gz"
  CI_WINDOWS_BUILD_CMD: ""
  CI_WINDOWS_VERIFY_CMD: ""
  CI_WINDOWS_ARTIFACT_PATH: "dist/*-windows.zip"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

cache:
  key: "python-$CI_PYTHON_VERSION-pip"
  paths:
    - .cache/pip/

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

ci_config_check:
  stage: validate
  image: "python:$CI_PYTHON_VERSION-slim"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  script:
    - |
      found=0
      for d in src app tests scripts; do
        if [ -d "$d" ]; then
          python -m compileall -q "$d"
          found=1
        fi
      done
      if [ "$found" -eq 0 ]; then
        python -m compileall -q .
      fi
    - |
      if [ -n "$CI_EXTRA_VALIDATE_CMD" ]; then
        sh -lc "$CI_EXTRA_VALIDATE_CMD"
      fi

quality:
  stage: quality
  image: "python:$CI_PYTHON_VERSION-slim"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  before_script:
    - sh -lc "$CI_INSTALL_CMD"
  script:
    - ruff check $CI_LINT_PATHS
    - sh -lc "$CI_TEST_CMD"
    - |
      if [ -z "$CI_STREAMLIT_APP" ]; then
        echo "Streamlit smoke test disabled for this project."
        exit 0
      fi

      streamlit run "$CI_STREAMLIT_APP" --server.headless=true --server.port=8501 > /tmp/streamlit.log 2>&1 &
      echo $! > /tmp/streamlit.pid

      python - <<'PY'
      import time
      import urllib.request

      deadline = time.time() + 30
      last = None
      while time.time() < deadline:
          try:
              with urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health", timeout=2) as response:
                  body = response.read().decode("utf-8", "replace")
                  if response.status == 200 and "ok" in body.lower():
                      print("Streamlit health check passed")
                      raise SystemExit(0)
          except Exception as exc:
              last = exc
              time.sleep(1)
      raise SystemExit(f"Streamlit did not become healthy: {last}")
      PY
  after_script:
    - if [ -f /tmp/streamlit.pid ]; then kill $(cat /tmp/streamlit.pid) || true; fi
    - if [ -f /tmp/streamlit.log ]; then cat /tmp/streamlit.log; fi

mac_rc_bundle:
  stage: package
  image: "python:$CI_PYTHON_VERSION-slim"
  rules:
    - if: '$CI_COMMIT_TAG && $CI_MAC_BUILD_CMD != ""'
  script:
    - sh -lc "$CI_MAC_BUILD_CMD"
    - |
      if [ -n "$CI_MAC_VERIFY_CMD" ]; then
        sh -lc "$CI_MAC_VERIFY_CMD"
      fi
  artifacts:
    name: "$CI_PROJECT_PATH_SLUG-mac-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - $CI_MAC_ARTIFACT_PATH
    expire_in: 30 days

windows_rc_bundle:
  stage: package
  image: "python:$CI_PYTHON_VERSION-slim"
  rules:
    - if: '$CI_COMMIT_TAG && $CI_WINDOWS_BUILD_CMD != ""'
  script:
    - sh -lc "$CI_WINDOWS_BUILD_CMD"
    - |
      if [ -n "$CI_WINDOWS_VERIFY_CMD" ]; then
        sh -lc "$CI_WINDOWS_VERIFY_CMD"
      fi
  artifacts:
    name: "$CI_PROJECT_PATH_SLUG-windows-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - $CI_WINDOWS_ARTIFACT_PATH
    expire_in: 30 days
