<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:">
  <title>MIR PCA Explorer</title>
  <style>
    :root {
      --surface:#fff;
      --panel:#f3f6f8;
      --ink:#183346;
      --muted:#496574;
      --line:#d4dfe5;
      --edge:#a8bbc5;
      --accent:#17677b;
      --retained:#147a78;
      --excluded:#b03748;
      --marker:#111;
      font:15px/1.45 system-ui,sans-serif;
      color:var(--ink);
      background:var(--panel);
    }
    * { box-sizing:border-box; }
    body { margin:0; }
    header { padding:20px 30px; background:#143b4d; color:white; }
    h1 { margin:0; font-size:25px; }
    h2 { margin:0 0 10px; font-size:17px; }
    main { max-width:1500px; margin:auto; padding:18px; }
    section { background:white; border:1px solid var(--line); border-radius:8px; padding:15px; margin-bottom:12px; }
    .controls, .plot-actions { display:flex; align-items:end; gap:9px 14px; flex-wrap:wrap; }
    label { display:grid; gap:4px; font-weight:600; }
    select, button { font:inherit; color:inherit; padding:6px 9px; background:white; border:1px solid var(--edge); border-radius:5px; }
    select {
      appearance:none; padding-inline-end:30px;
      background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2214%22%20height%3D%2210%22%20viewBox%3D%220%200%2014%2010%22%3E%3Cpath%20d%3D%22M2.4%203.2l4.6%204.4%204.6-4.4%22%20fill%3D%22none%22%20stroke%3D%22%23385c60%22%20stroke-width%3D%221.7%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E");
      background-position:right 9px center; background-size:14px 10px; background-repeat:no-repeat;
    }
    button { cursor:pointer; }
    button:hover { background:var(--panel); }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    .note, #basis { color:var(--muted); margin:4px 0 0; }
    #status { margin:10px 0 0; font-weight:650; }
    .plot-actions { margin-bottom:4px; }
    .plot-area { position:relative; height:clamp(380px,63vh,690px); }
    #chart { display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
    #chart.dragging { cursor:grabbing; }
    #tip {
      position:absolute; pointer-events:none; white-space:pre-line; font-size:12px;
      padding:6px 8px; color:var(--ink); background:var(--panel); border:1px solid var(--edge); border-radius:4px;
    }
    .variance-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(128px,1fr)); gap:8px 15px; }
    .variance-bar { min-width:0; }
    .variance-label { display:flex; justify-content:space-between; font-size:12px; }
    .variance-track {
      display:block; width:100%; height:6px; min-height:6px; accent-color:var(--accent);
    }
    @media(max-width:600px) { header { padding:15px; } main { padding:9px; } section { padding:10px; } }
  </style>
</head>
<body>
  <header><h1>MIR PCA Explorer</h1><div>Offline view of the saved PCA basis</div></header>
  <main>
    <section aria-label="PCA settings">
      <div class="controls">
        <label>Property <select id="property"></select></label>
        <label>X axis <select id="x-axis"></select></label>
        <label>Y axis <select id="y-axis"></select></label>
        <label>Colour by <select id="colour"><option>Treatment</option><option>Reference value</option><option>Status</option></select></label>
        <label>Records <select id="subset"><option>All in fitted model</option><option>Retained only</option><option>Confirmed excluded only</option></select></label>
      </div>
      <p id="status" role="status"></p>
      <p id="basis"></p>
    </section>
    <section aria-label="PCA scatter plot">
      <div class="plot-actions">
        <button id="reset">Reset view</button>
        <button id="zoom-in">Zoom in</button>
        <button id="zoom-out">Zoom out</button>
        <button id="png">Download current PNG</button>
      </div>
      <div class="plot-area">
        <canvas id="chart" tabindex="0" aria-label="PCA scatter plot. Drag to pan and scroll to zoom."></canvas>
        <div id="tip" role="tooltip" hidden></div>
      </div>
      <p class="note">Hover for sample and filename details. Drag to pan and scroll to zoom.</p>
    </section>
    <section aria-label="Explained variance">
      <h2>Explained variance</h2>
      <div class="variance-grid" id="variance"></div>
    </section>
  </main>
  <!-- INLINE_PCA -->
</body>
</html>
